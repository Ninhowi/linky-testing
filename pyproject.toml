[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linky-testing-final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "allure-pytest>=2.16.0",
  "cloakbrowser>=0.3.30",
  "openpyxl>=3.1.5",
  "pytest>=9.0.3",
  "pytest-xdist>=3.8.0",
  "python-dotenv>=1.2.2",
  "selenium>=4.44.0",
]

[project.scripts]
ensure-cloak = "helpers.runtime.ensure_cloak:main"
test = "helpers.runtime.run_test:main"
allure-report = "helpers.runtime.run_allure:main"

[tool.hatch.build.targets.wheel]
packages = ["helpers", "pages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sign_in: sign-in auth flow tests / test luồng đăng nhập",
  "sign_up: sign-up auth flow tests / test luồng đăng ký",
  "reset_password: reset-password auth flow tests / test luồng đặt lại mật khẩu",
  "profile: user profile page tests (requires USER_EMAIL / USER_PASSWORD) / test trang hồ sơ (cần USER_EMAIL / USER_PASSWORD)",
  "call: /call page tests (requires media flags and authenticated users) / test trang /call",
  "call_smoke: single-profile /call smoke tests / test smoke một profile",
  "call_integration: two-profile /call integration tests / test integration hai profile",
  "call_in_call_chat: parametrized in-call chat tests (shared matched pair) / test chat in_call dùng chung một cặp ghép",
  "performance: performance tests / kiểm thử hiệu năng",
]
